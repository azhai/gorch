<!DOCTYPE html>
<html lang="en" data-theme="monet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/material3.css" />
    <title>Gorch</title>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <div x-data="gorch()" x-cloak>
      <!-- ── App shell (every page except login) ─────────────────────────── -->
      <template x-if="ready && route !== '/login'">
        <div>
          <header class="md-app-bar">
            <div class="md-app-bar__row">
              <div class="md-row" style="gap:24px">
                <div class="md-app-bar__brand">
                  <img :src="asset('logo.svg')" alt="Gorch" />
                  <h1>Gorch</h1>
                </div>
                <nav class="md-nav">
                  <template x-for="item in navItems.filter((i) => !i.authOnly || showLogout)" :key="item.path">
                    <a
                      :href="hrefOf(item.path)"
                      :class="`md-nav__link${isActive(item.path) ? ' md-nav__link--active' : ''}`"
                      @click.prevent="go(item.path)"
                      x-text="t(item.labelKey)"
                    ></a>
                  </template>
                </nav>
              </div>

              <div class="md-app-bar__tools">
                <span class="md-connection">
                  <span
                    :class="`md-connection__dot ${sseConnected ? 'md-connection__dot--on' : 'md-connection__dot--off'}`"
                  ></span>
                  <span x-text="sseConnected ? t('status.connected') : t('status.reconnecting')"></span>
                </span>

                <template x-if="showLogout">
                  <button class="md-btn md-btn--sm" @click="logout()" x-text="t('nav.logout')"></button>
                </template>
              </div>
            </div>
          </header>

          <main class="md-content">
            <!-- ── Dashboard ──────────────────────────────────────────────── -->
            <template x-if="route === '/'">
              <div x-data="dashboardView()">
                <div class="md-row md-row--between" style="margin-bottom:16px">
                  <h2 x-text="t('dashboard.services')"></h2>
                  <div class="md-row md-row--tight">
                    <div class="md-row md-row--tight">
                      <span class="md-muted-sm" x-text="t('dashboard.duration')"></span>
                      <select
                        id="sse-interval"
                        class="md-select md-select--sm"
                        :value="sseInterval"
                        @change="changeInterval($event.target.value)"
                      >
                        <template x-for="opt in sseOptions" :key="opt">
                          <option :value="opt" x-text="opt"></option>
                        </template>
                      </select>
                    </div>
                    <div class="md-row md-row--tight">
                      <span class="md-muted-sm" x-text="t('dashboard.uptime')"></span>
                      <select id="uptime-mode" class="md-select md-select--sm" x-model="uptimeMode">
                        <option value="elapsed" x-text="t('dashboard.elapsed')"></option>
                        <option value="start" x-text="t('dashboard.startTime')"></option>
                      </select>
                    </div>
                  </div>
                </div>

                <template x-if="services.length > 0">
                  <div class="md-card-grid">
                    <template x-for="svc in services" :key="svc.name">
                      <div class="md-card md-card--elevated">
                        <div class="md-service-card__head">
                          <div class="md-service-card__name">
                            <span :class="`md-status-dot ${statusClass(svc.status)}`"></span>
                            <h3 x-text="svc.name"></h3>
                          </div>
                          <span class="md-chip" x-text="statusLabel(svc)"></span>
                        </div>

                        <div class="md-metric-grid">
                          <div>
                            <span class="md-metric-label" x-text="t('service.pid')"></span>
                            <span class="md-metric-value" x-text="svc.pid || '-'"></span>
                          </div>
                          <div>
                            <span class="md-metric-label" x-text="t('service.uptime')"></span>
                            <span class="md-metric-value" x-text="uptimeFor(svc)"></span>
                          </div>
                          <div>
                            <span class="md-metric-label" x-text="t('service.memory')"></span>
                            <span class="md-metric-value" x-text="memoryFor(svc)"></span>
                          </div>
                        </div>

                        <div class="md-row md-row--tight">
                          <template x-if="svc.status !== 'running'">
                            <button
                              class="md-btn md-btn--tonal md-btn--sm"
                              :disabled="isPending(svc.name)"
                              @click="act('start', svc.name)"
                              x-text="t('service.start')"
                            ></button>
                          </template>
                          <template x-if="svc.status === 'running'">
                            <button
                              class="md-btn md-btn--danger md-btn--sm"
                              :disabled="isPending(svc.name)"
                              @click="act('stop', svc.name)"
                            >
                              <template x-if="isPending(svc.name)"><span class="md-spinner"></span></template>
                              <span x-text="t('service.stop')"></span>
                            </button>
                          </template>
                          <button
                            class="md-btn md-btn--outlined md-btn--sm"
                            :disabled="isPending(svc.name)"
                            @click="act('restart', svc.name)"
                          >
                            <template x-if="isPending(svc.name)"><span class="md-spinner"></span></template>
                            <span x-text="t('service.restart')"></span>
                          </button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="services.length === 0">
                  <div class="md-empty" x-text="t('dashboard.noServices')"></div>
                </template>
              </div>
            </template>

            <!-- ── Logs ───────────────────────────────────────────────────── -->
            <template x-if="route === '/logs'">
              <div x-data="logsView()">
                <div class="md-row" style="margin-bottom:16px">
                  <h2 x-text="t('logs.title')"></h2>
                  <select
                    class="md-select"
                    aria-label="Select service to view logs"
                    :value="selected"
                    @change="pick($event.target.value)"
                  >
                    <option value="" x-text="t('logs.selectService')"></option>
                    <template x-for="s in services" :key="s.name">
                      <option :value="s.name" x-text="s.name"></option>
                    </template>
                  </select>

                  <template x-if="selected">
                    <div class="md-segmented">
                      <template x-for="type in logTypes" :key="type">
                        <button
                          :class="`md-segmented__item${logType === type ? ' md-segmented__item--selected' : ''}`"
                          @click="pickType(type)"
                          x-text="type === 'stdout' ? t('logs.stdout') : t('logs.stderr')"
                        ></button>
                      </template>
                    </div>
                  </template>

                  <template x-if="selected">
                    <button
                      class="md-btn md-btn--danger md-btn--sm"
                      :disabled="clearing"
                      @click="clear()"
                      x-text="clearing ? t('logs.clearing') : t('logs.clear')"
                    ></button>
                  </template>
                </div>

                <template x-if="error">
                  <div class="md-banner md-banner--error" style="margin-bottom:8px" x-text="error"></div>
                </template>

                <template x-if="logData && logData.logPath">
                  <div class="md-muted-sm" style="margin-bottom:8px">
                    <span x-text="`${t('logs.source')}: ${logData.logPath}`"></span>
                  </div>
                </template>

                <div class="md-log-pane">
                  <template x-if="lines.length === 0">
                    <p class="md-log-empty" x-text="t('logs.noLogs')"></p>
                  </template>
                  <template x-for="(line, idx) in lines" :key="idx">
                    <div class="md-log-line" x-text="line"></div>
                  </template>
                </div>
              </div>
            </template>

            <!-- ── Config ─────────────────────────────────────────────────── -->
            <template x-if="route === '/config'">
              <div x-data="configView()">
                <div class="md-row md-row--between" style="margin-bottom:16px">
                  <h2 x-text="t('config.title')"></h2>
                  <div class="md-row md-row--tight">
                    <select
                      class="md-select"
                      aria-label="Select service to configure"
                      :value="selected"
                      @change="pickService($event.target.value)"
                    >
                      <option value="" x-text="t('config.selectService')"></option>
                      <template x-for="s in services" :key="s.name">
                        <option :value="s.name" x-text="s.name"></option>
                      </template>
                    </select>
                    <button
                      class="md-btn md-btn--tonal md-btn--sm"
                      aria-label="Create new service"
                      @click="startCreate()"
                      x-text="t('config.new')"
                    ></button>
                    <template x-if="selected && !isCreating">
                      <button
                        class="md-btn md-btn--danger md-btn--sm"
                        :aria-label="`Delete service ${selected}`"
                        @click="handleDelete()"
                        x-text="t('config.delete')"
                      ></button>
                    </template>
                  </div>
                </div>

                <!-- The banner sits outside the form so the outcome of a create or a
                     delete — both of which clear `cfg` — is still visible. -->
                <template x-if="message">
                  <div :class="`md-banner ${bannerClass}`" role="status" x-text="message"></div>
                </template>

                <template x-if="!cfg">
                  <div class="md-card">
                    <p class="md-muted" x-text="t('config.selectHint')"></p>
                  </div>
                </template>

                <template x-if="cfg">
                  <form
                    class="md-card md-field-group"
                    @submit.prevent="isCreating ? handleCreate() : handleSaveAndApply()"
                  >
                    <template x-if="isCreating">
                      <div>
                        <label class="md-label" for="cfg-name">
                          <span x-text="t('config.serviceName')"></span>
                          <span class="md-label__req" :title="t('config.required')">*</span>
                        </label>
                        <input
                          id="cfg-name"
                          class="md-field md-field--mono"
                          type="text"
                          x-model="creatingName"
                          :placeholder="t('config.serviceNamePlaceholder')"
                        />
                      </div>
                    </template>

                    <div>
                      <label class="md-label" for="cfg-workdir">
                        <span x-text="t('config.workingDir')"></span>
                        <code class="md-key">WORK_DIR</code>
                      </label>
                      <input
                        id="cfg-workdir"
                        class="md-field md-field--mono"
                        type="text"
                        x-model="cfg.WORK_DIR"
                        :placeholder="t('config.workingDirPlaceholder')"
                      />
                      <p class="md-field__desc" x-text="t('config.workingDirHint')"></p>
                    </div>

                    <div>
                      <label class="md-label" for="cfg-exec">
                        <span x-text="t('config.command')"></span>
                        <code class="md-key">EXEC_CMD</code>
                        <span class="md-label__req" :title="t('config.required')">*</span>
                      </label>
                      <input
                        id="cfg-exec"
                        class="md-field md-field--mono"
                        type="text"
                        x-model="cfg.EXEC_CMD"
                        :placeholder="t('config.commandPlaceholder')"
                      />
                      <p class="md-field__desc" x-text="t('config.commandHint')"></p>
                    </div>

                    <div>
                      <span class="md-label" id="cfg-policy-label">
                        <span x-text="t('config.restartPolicy')"></span>
                        <code class="md-key">RESTART_POLICY</code>
                      </span>
                      <div class="md-segmented" role="radiogroup" aria-labelledby="cfg-policy-label">
                        <template x-for="p in restartPolicies" :key="p">
                          <button
                            type="button"
                            class="md-segmented__item"
                            role="radio"
                            :aria-checked="cfg.RESTART_POLICY === p"
                            :class="{ 'md-segmented__item--selected': cfg.RESTART_POLICY === p }"
                            @click="cfg.RESTART_POLICY = p"
                            x-text="p"
                          ></button>
                        </template>
                      </div>
                      <p class="md-field__desc" x-text="t('config.restartPolicyHint')"></p>
                    </div>

                    <div class="md-grid-2">
                      <div>
                        <label class="md-label" for="cfg-backoff">
                          <span x-text="t('config.backOffName')"></span>
                          <code class="md-key">BACK_OFF</code>
                        </label>
                        <input
                          id="cfg-backoff"
                          class="md-field"
                          type="number"
                          min="0"
                          x-model="cfg.BACK_OFF"
                          placeholder="0"
                        />
                        <p class="md-field__desc" x-text="t('config.backOffHint')"></p>
                      </div>
                      <div>
                        <label class="md-label" for="cfg-checkport">
                          <span x-text="t('config.checkPort')"></span>
                          <code class="md-key">CHECK_PORT</code>
                        </label>
                        <input
                          id="cfg-checkport"
                          class="md-field"
                          type="number"
                          min="0"
                          max="65535"
                          x-model="cfg.CHECK_PORT"
                          :placeholder="`0 (${t('config.off')})`"
                        />
                        <p class="md-field__desc" x-text="t('config.checkPortHint')"></p>
                      </div>
                    </div>

                    <template x-for="s in sections" :key="s.key">
                      <section class="md-section">
                        <button
                          type="button"
                          class="md-section__head"
                          :aria-expanded="isOpen(s.key)"
                          @click="toggle(s.key)"
                        >
                          <span class="md-section__caret" aria-hidden="true">▸</span>
                          <span class="md-section__title" x-text="t(s.title)"></span>
                          <template x-for="k in sectionKeys(s)" :key="k">
                            <code class="md-key md-key--value" x-text="k"></code>
                          </template>
                          <span class="md-section__changed" x-show="sectionChanged(s)" x-text="t('config.unsaved')"></span>
                        </button>

                        <div class="md-section__body" x-show="isOpen(s.key)">
                          <template x-if="s.key === 'schedule'">
                            <div class="md-field-group">
                              <div>
                                <label class="md-label" for="cfg-cron">
                                  <span x-text="t('config.cronName')"></span>
                                  <code class="md-key">CRON</code>
                                </label>
                                <div class="md-row md-row--tight">
                                  <input
                                    id="cfg-cron"
                                    class="md-field md-field--mono"
                                    style="flex:1"
                                    type="text"
                                    x-model="cfg.CRON"
                                    @input="cronResult = null"
                                    :placeholder="t('config.cronPlaceholder')"
                                  />
                                  <button
                                    type="button"
                                    class="md-btn md-btn--tonal"
                                    :disabled="!cfg.CRON || cronValidating"
                                    @click="handleValidateCron()"
                                    x-text="cronValidating ? t('config.checking') : t('config.validate')"
                                  ></button>
                                </div>
                                <p class="md-field__desc" x-text="t('config.cronHint')"></p>
                                <template x-if="cronResult">
                                  <div
                                    :class="cronBannerClass"
                                    style="margin-top:8px"
                                    x-text="cronBannerText()"
                                  ></div>
                                </template>
                              </div>
                              <div x-show="cfg.CRON">
                                <label class="md-label" for="cfg-cron-timeout">
                                  <span x-text="t('config.cronTimeout')"></span>
                                  <code class="md-key">CRON_TIMEOUT</code>
                                </label>
                                <input
                                  id="cfg-cron-timeout"
                                  class="md-field"
                                  type="number"
                                  min="0"
                                  x-model="cfg.CRON_TIMEOUT"
                                  placeholder="0"
                                />
                                <p class="md-field__desc" x-text="t('config.cronTimeoutHint')"></p>
                              </div>

                              <!-- Runs are history, not config: they come from the
                                   scheduler, so they only exist for a saved service. -->
                              <div x-show="cfg.CRON && !isCreating" style="margin-top:24px">
                                <div class="md-row md-row--between" style="margin-bottom:8px">
                                  <span class="md-label" x-text="t('config.cronRuns')"></span>
                                  <button
                                    type="button"
                                    class="md-btn md-btn--tonal md-btn--sm"
                                    :disabled="cronRunsLoading"
                                    @click="loadCronRuns()"
                                    x-text="cronRunsLoading ? t('config.checking') : t('config.cronRunsRefresh')"
                                  ></button>
                                </div>
                                <template x-if="!cronRuns.length">
                                  <p class="md-muted-sm" x-text="t('config.cronRunsEmpty')"></p>
                                </template>
                                <template x-if="cronRuns.length">
                                  <div>
                                    <template x-for="run in cronRuns" :key="`${run.startedAt}-${run.pid}`">
                                      <div
                                        class="md-row md-row--between"
                                        style="padding:6px 0;border-bottom:1px solid var(--md-outline-variant)"
                                      >
                                        <div class="md-row md-row--tight">
                                          <span
                                            :class="`md-chip ${runChipClass(run)}`"
                                            x-text="runStatus(run)"
                                          ></span>
                                          <span class="md-mono md-muted-sm" x-text="runTime(run)"></span>
                                        </div>
                                        <span class="md-muted-sm" x-text="runDetail(run)"></span>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </div>
                          </template>

                          <template x-if="s.key === 'process'">
                            <div class="md-field-group">
                              <div>
                                <label class="md-label" for="cfg-restart-cmd">
                                  <span x-text="t('config.reload')"></span>
                                  <code class="md-key">RESTART_CMD</code>
                                </label>
                                <input
                                  id="cfg-restart-cmd"
                                  class="md-field md-field--mono"
                                  type="text"
                                  x-model="cfg.RESTART_CMD"
                                  placeholder="nginx -s reload"
                                />
                                <p class="md-field__desc" x-text="t('config.gracefulReload')"></p>
                              </div>
                              <div>
                                <label class="md-label" for="cfg-pre-action">
                                  <span x-text="t('config.preActionName')"></span>
                                  <code class="md-key">PRE_ACTION</code>
                                </label>
                                <input
                                  id="cfg-pre-action"
                                  class="md-field md-field--mono"
                                  type="text"
                                  x-model="cfg.PRE_ACTION"
                                  placeholder="pkill -f myservice"
                                />
                                <p class="md-field__desc" x-text="t('config.preAction')"></p>
                              </div>
                              <div>
                                <label class="md-label" for="cfg-pid-file">
                                  <span x-text="t('config.pidFileName')"></span>
                                  <code class="md-key">PID_FILE</code>
                                </label>
                                <input
                                  id="cfg-pid-file"
                                  class="md-field md-field--mono"
                                  type="text"
                                  x-model="cfg.PID_FILE"
                                  placeholder="/var/run/nginx.pid"
                                />
                                <p class="md-field__desc" x-text="t('config.pidFile')"></p>
                              </div>
                            </div>
                          </template>

                          <template x-if="s.key === 'deps'">
                            <div class="md-field-group">
                              <div>
                                <span class="md-label">
                                  <span x-text="t('config.dependencies')"></span>
                                  <code class="md-key">DEPENDS_ON</code>
                                </span>
                                <div class="md-row md-row--tight" x-show="depChoices.length">
                                  <template x-for="dep in depChoices" :key="dep.name">
                                    <button
                                      type="button"
                                      class="md-chip md-chip--plain md-chip--toggle"
                                      :aria-pressed="hasDep(dep.name)"
                                      @click="toggleDep(dep.name)"
                                      x-text="dep.name"
                                    ></button>
                                  </template>
                                </div>
                                <input
                                  class="md-field md-field--sm md-field--mono"
                                  style="margin-top:8px"
                                  type="text"
                                  :value="depsText"
                                  @change="setDeps($event.target.value)"
                                  :placeholder="t('config.depsPlaceholder')"
                                  aria-label="DEPENDS_ON"
                                />
                                <p class="md-field__desc" x-text="t('config.dependenciesHint')"></p>
                              </div>

                              <div>
                                <div class="md-row md-row--between" style="margin-bottom:4px">
                                  <span class="md-label" style="margin:0">
                                    <span x-text="t('config.environment')"></span>
                                    <code class="md-key">ENV_VARS</code>
                                  </span>
                                  <button
                                    type="button"
                                    class="md-btn md-btn--tonal md-btn--sm"
                                    @click="addEnvVar()"
                                    x-text="t('config.add')"
                                  ></button>
                                </div>
                                <template x-if="envRows.length === 0">
                                  <p class="md-muted-sm" x-text="t('config.noEnvVars')"></p>
                                </template>
                                <template x-for="(row, i) in envRows" :key="i">
                                  <div class="md-env-row">
                                    <input
                                      class="md-field md-field--sm md-field--mono"
                                      type="text"
                                      x-model="row.k"
                                      @input="commitEnv()"
                                      :placeholder="t('config.key')"
                                      :aria-label="t('config.key')"
                                    />
                                    <input
                                      class="md-field md-field--sm"
                                      type="text"
                                      x-model="row.v"
                                      :placeholder="t('config.value')"
                                      :aria-label="t('config.value')"
                                    />
                                    <button
                                      type="button"
                                      class="md-btn md-btn--danger md-btn--sm"
                                      :aria-label="`Remove environment variable ${row.k}`"
                                      @click="removeEnvVar(i)"
                                    >
                                      x
                                    </button>
                                  </div>
                                </template>
                                <p
                                  class="md-field__desc md-field__desc--error"
                                  x-show="envConflicts.length"
                                  x-text="t('config.envConflict', { keys: envConflicts.join(', ') })"
                                ></p>
                                <p class="md-field__desc" x-text="t('config.environmentHint')"></p>
                              </div>
                            </div>
                          </template>

                          <template x-if="s.key === 'logs'">
                            <div class="md-field-group">
                              <div class="md-grid-2">
                                <div>
                                  <label class="md-label" for="cfg-stdout">
                                    <span x-text="t('config.logOutput')"></span>
                                    <code class="md-key">STDOUT</code>
                                  </label>
                                  <input
                                    id="cfg-stdout"
                                    class="md-field md-field--mono"
                                    type="text"
                                    x-model="cfg.STDOUT"
                                  />
                                </div>
                                <div>
                                  <label class="md-label" for="cfg-stderr">
                                    <span x-text="t('config.errorOutput')"></span>
                                    <code class="md-key">STDERR</code>
                                  </label>
                                  <input
                                    id="cfg-stderr"
                                    class="md-field md-field--mono"
                                    type="text"
                                    x-model="cfg.STDERR"
                                  />
                                </div>
                              </div>
                              <p class="md-field__desc" x-text="t('config.logFilesHint')"></p>
                            </div>
                          </template>
                        </div>
                      </section>
                    </template>

                    <div class="md-form-actions">
                      <span class="md-form-actions__state" x-show="hasChanges()">
                        <span x-text="t('config.unsaved')"></span>
                        <code class="md-key md-key--value" x-text="changed.join(' ')"></code>
                      </span>
                      <span class="md-push"></span>
                      <button
                        type="button"
                        class="md-btn"
                        x-show="hasChanges()"
                        @click="discard()"
                        x-text="t('config.discard')"
                      ></button>
                      <button
                        type="submit"
                        class="md-btn md-btn--filled"
                        x-show="!isCreating"
                        :disabled="saving"
                        x-text="saving ? t('config.saving') : t('config.saveAndApply')"
                      ></button>
                      <button
                        type="submit"
                        class="md-btn md-btn--filled"
                        x-show="isCreating"
                        :disabled="!canCreate"
                        x-text="saving ? t('config.creating') : t('config.createService')"
                      ></button>
                      <button
                        type="button"
                        class="md-btn"
                        x-show="isCreating"
                        @click="cancelCreate()"
                        x-text="t('config.cancel')"
                      ></button>
                    </div>
                  </form>
                </template>
              </div>
            </template>

            <!-- ── TOTP / Security ────────────────────────────────────────── -->
            <template x-if="route === '/totp'">
              <div x-data="totpView()" x-init="start()" style="max-width:672px;margin:0 auto">
                <h2 style="margin-bottom:24px" x-text="t('totp.title')"></h2>

                <template x-if="error">
                  <div class="md-banner md-banner--error" style="margin-bottom:16px" x-text="error"></div>
                </template>
                <template x-if="success">
                  <div class="md-banner md-banner--success" style="margin-bottom:16px" x-text="success"></div>
                </template>

                <template x-if="setupData">
                  <div class="md-field-group">
                    <div class="md-card" style="text-align:center">
                      <h3 style="margin-bottom:16px" x-text="t('totp.scanQr')"></h3>
                      <!-- The server sends no QR image yet, only the otpauth
                           URI, so the card degrades to a link instead of a
                           broken <img>. -->
                      <template x-if="setupData.qrCode">
                        <img class="md-qr" :src="setupData.qrCode" alt="TOTP QR Code" />
                      </template>
                      <div
                        class="md-muted-sm"
                        style="margin-top:12px"
                        x-text="setupData.qrCode ? t('totp.scanQrHelp') : t('totp.noQrHint')"
                      ></div>
                    </div>

                    <div class="md-card">
                      <h3 style="margin-bottom:16px" x-text="t('totp.manualEntry')"></h3>
                      <div class="md-code-box md-mono" x-text="setupData.secret"></div>
                      <template x-if="setupData.otpauthUri">
                        <div style="margin-top:12px">
                          <div class="md-label" x-text="t('totp.setupUri')"></div>
                          <div
                            class="md-code-box md-mono"
                            style="word-break:break-all;text-align:left"
                            x-text="setupData.otpauthUri"
                          ></div>
                        </div>
                      </template>
                    </div>

                    <div class="md-card">
                      <h3 style="margin-bottom:16px" x-text="t('totp.backupCodes')"></h3>
                      <div class="md-muted-sm" style="margin-bottom:12px" x-text="t('totp.backupSaveHint')"></div>
                      <div class="md-grid-2">
                        <template x-for="(code, i) in setupData.backupCodes" :key="i">
                          <div class="md-code-box md-mono" style="text-align:center" x-text="code"></div>
                        </template>
                      </div>
                    </div>

                    <div class="md-card">
                      <h3 style="margin-bottom:16px" x-text="t('totp.verifySetup')"></h3>
                      <div class="md-muted-sm" style="margin-bottom:12px" x-text="t('totp.verifySetupHelp')"></div>
                      <div class="md-row md-row--tight">
                        <input
                          class="md-field md-centered-code"
                          style="flex:1"
                          type="text"
                          maxlength="6"
                          :value="verifyCode"
                          placeholder="000000"
                          @input="setVerifyCode($event.target.value)"
                        />
                        <button
                          class="md-btn md-btn--filled"
                          :disabled="loading || verifyCode.length !== 6"
                          @click="handleVerifySetup()"
                          x-text="t('totp.verifyButton')"
                        ></button>
                      </div>
                    </div>

                    <button class="md-btn" @click="cancelSetup()" x-text="t('totp.cancelSetup')"></button>
                  </div>
                </template>

                <template x-if="!setupData">
                  <div>
                    <template x-if="loading || !status">
                      <div class="md-muted-sm" x-text="t('totp.loading')"></div>
                    </template>

                    <template x-if="!loading && status">
                      <div class="md-field-group">
                        <div class="md-card">
                          <div class="md-row md-row--between">
                            <div>
                              <h3 x-text="t('totp.status')"></h3>
                              <div
                                class="md-muted-sm"
                                style="margin-top:4px"
                                x-text="status.configured === false
                                  ? t('totp.serverDisabled')
                                  : (status.enabled ? t('totp.enabled') : t('totp.notEnabled'))"
                              ></div>
                            </div>
                            <span :class="`md-chip ${status.enabled ? 'md-chip--success' : 'md-chip--filled'}`">
                              <span
                                x-text="status.enabled ? t('totp.enabledBadge') : t('totp.disabledBadge')"
                              ></span>
                            </span>
                          </div>
                        </div>

                        <template x-if="status.enabled">
                          <div class="md-card">
                            <h3 style="margin-bottom:4px" x-text="t('totp.backupCodes')"></h3>
                            <div
                              class="md-muted-sm"
                              style="margin-bottom:12px"
                              x-text="t('totp.backupRemaining', { count: status.backupCodes })"
                            ></div>
                            <button
                              class="md-btn md-btn--tonal md-btn--sm"
                              :disabled="loading"
                              @click="handleRegenerateBackupCodes()"
                              x-text="t('totp.regenerate')"
                            ></button>
                          </div>
                        </template>

                        <div class="md-row md-row--tight">
                          <template x-if="!status.enabled">
                            <button
                              class="md-btn md-btn--filled"
                              :disabled="loading || status.configured === false"
                              @click="handleSetup()"
                              x-text="t('totp.enable')"
                            ></button>
                          </template>
                          <template x-if="status.enabled">
                            <button
                              class="md-btn md-btn--danger"
                              :disabled="loading"
                              @click="handleDisable()"
                              x-text="t('totp.disable')"
                            ></button>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </main>
        </div>
      </template>

      <!-- ── Login ────────────────────────────────────────────────────────── -->
      <template x-if="ready && route === '/login'">
        <div x-data="loginView()" class="md-auth-page">
          <div class="md-auth-card">
            <h1 x-text="t('login.title')"></h1>

            <div class="md-row md-row--end" style="margin-bottom:16px">
              <div class="md-row md-row--tight">
                <span class="md-muted-sm" x-text="t('login.language')"></span>
                <select
                  id="login-lang"
                  class="md-select md-select--sm"
                  :value="lang"
                  @change="setLang($event.target.value)"
                >
                  <option value="en">English</option>
                  <option value="zh-CN">简体中文</option>
                </select>
              </div>
            </div>

            <template x-if="error">
              <div class="md-banner md-banner--error" style="margin-bottom:16px" x-text="error"></div>
            </template>

            <template x-if="step === 'credentials'">
              <form class="md-field-group" @submit.prevent="submitCredentials()">
                <div>
                  <label class="md-label" x-text="t('login.username')"></label>
                  <input
                    class="md-field"
                    type="text"
                    x-model="username"
                    :placeholder="t('login.usernamePlaceholder')"
                    :disabled="loading"
                  />
                </div>
                <div>
                  <label class="md-label" x-text="t('login.password')"></label>
                  <input
                    class="md-field"
                    type="password"
                    x-model="password"
                    :placeholder="t('login.passwordPlaceholder')"
                    :disabled="loading"
                  />
                </div>
                <button
                  class="md-btn md-btn--filled md-btn--block"
                  type="submit"
                  :disabled="loading"
                  x-text="loading ? t('login.signingIn') : t('login.signIn')"
                ></button>
              </form>
            </template>

            <template x-if="step !== 'credentials'">
              <form class="md-field-group" @submit.prevent="submitTotp()">
                <p class="md-muted" style="text-align:center;margin:0" x-text="t('login.totpTitle')"></p>
                <div>
                  <label class="md-label" x-text="t('login.verificationCode')"></label>
                  <input
                    class="md-field md-centered-code"
                    type="text"
                    maxlength="6"
                    :value="totpCode"
                    :placeholder="t('login.totpPlaceholder')"
                    :disabled="loading"
                    @input="onlyDigits('totpCode', $event.target.value)"
                  />
                </div>
                <button
                  class="md-btn md-btn--filled md-btn--block"
                  type="submit"
                  :disabled="loading || totpCode.length !== 6"
                  x-text="loading ? t('login.verifying') : t('login.verify')"
                ></button>
                <button class="md-btn md-btn--block" type="button" @click="back()" x-text="t('login.back')"></button>
              </form>
            </template>
          </div>
        </div>
      </template>

      <!-- ── App-wide snackbar ────────────────────────────────────────────── -->
      <template x-if="toast">
        <div
          :class="`md-snackbar${toast.type === 'error' ? ' md-snackbar--error' : ''}`"
          role="status"
          @click="dismiss()"
          x-text="toast.message"
        ></div>
      </template>
    </div>
  </body>
</html>
